[workspace]
members = [
    "crates/clausal-core",
    "crates/clausal",
    "crates/clausal-dimacs",
    "crates/clausal-proofs",
    "crates/clausal-ipasir",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Will McCallion"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/willmccallion/clausal"
homepage = "https://github.com/willmccallion/clausal"
description = "A pure-Rust CDCL SAT solver with a no_std-friendly core, a pluggable-trait API, and WASM support."
readme = "README.md"
categories = ["algorithms", "mathematics", "no-std", "wasm"]
keywords = ["sat", "solver", "cdcl", "satisfiability", "logic"]

[workspace.dependencies]
clausal-core = { version = "0.1.0", path = "crates/clausal-core", default-features = false }
clausal = { version = "0.1.0", path = "crates/clausal", default-features = false }
clausal-dimacs = { version = "0.1.0", path = "crates/clausal-dimacs", default-features = false }
clausal-proofs = { version = "0.1.0", path = "crates/clausal-proofs", default-features = false }
clausal-ipasir = { version = "0.1.0", path = "crates/clausal-ipasir", default-features = false }

static_assertions = "1.1"
proptest = "1.5"
trybuild = "1.0"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
incremental   = false

[profile.profiling]
inherits = "release"
debug    = 1
strip    = "none"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_results = "deny"
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

unwrap_used     = "deny"
expect_used     = "deny"
todo            = "deny"
unimplemented   = "deny"

module_name_repetitions = "allow"
must_use_candidate      = "allow"
similar_names           = "allow"
missing_errors_doc      = "allow"

[workspace.lints.rustdoc]
all = "deny"
missing_crate_level_docs = "deny"
broken_intra_doc_links   = "deny"
