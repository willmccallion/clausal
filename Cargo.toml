[package]
name = "clausal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Will McCallion"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/willmccallion/clausal"
homepage = "https://github.com/willmccallion/clausal"
description = "A pure-Rust CDCL SAT solver with a no_std-friendly core, a pluggable-trait API, and WASM support."
readme = "README.md"
categories = ["algorithms", "mathematics", "no-std"]
keywords = ["sat", "solver", "cdcl", "satisfiability", "logic"]

[features]
default = ["std", "dimacs"]
std = []
dimacs = ["std"]        # DIMACS parser needs Read/Write from std
proofs = ["std"]        # proof writers need Write from std

[dependencies]
static_assertions = "1.1"

[dev-dependencies]
proptest = "1.5"
trybuild = "1.0"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
incremental   = false

[profile.profiling]
inherits = "release"
debug    = 1
strip    = "none"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_results = "deny"
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

unwrap_used     = "deny"
expect_used     = "deny"
todo            = "deny"
unimplemented   = "deny"

module_name_repetitions = "allow"
must_use_candidate      = "allow"
similar_names           = "allow"
missing_errors_doc      = "allow"

[lints.rustdoc]
all = "deny"
missing_crate_level_docs = "deny"
broken_intra_doc_links   = "deny"
